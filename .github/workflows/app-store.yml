name: App Store

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Tag or commit to build
        type: string
        required: true

concurrency:
  group: app-store
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Select Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Restore signing credentials
        shell: bash
        env:
          MAS_CERTIFICATES_P12: ${{ secrets.MAS_CERTIFICATES_P12 }}
          MAS_CERTIFICATES_PASSWORD: ${{ secrets.MAS_CERTIFICATES_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$MAS_CERTIFICATES_P12" | base64 -D > "$RUNNER_TEMP/mas.p12"
          printf '%s' "$APPLE_API_KEY_P8" | base64 -D > "$RUNNER_TEMP/apple.p8"
          KEYCHAIN="$RUNNER_TEMP/mas-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/mas.p12" -k "$KEYCHAIN" -P "$MAS_CERTIFICATES_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
      - name: Build and upload
        env:
          PAGE_OWL_UPLOAD: "1"
          APPLE_API_KEY: ${{ runner.temp }}/apple.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/app-store.sh
      - name: Remove signing credentials
        if: always()
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/mas-signing.keychain-db"
          if [ -f "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN"; fi
          rm -f "$RUNNER_TEMP/mas.p12" "$RUNNER_TEMP/apple.p8"
