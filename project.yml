name: Books
options:
  bundleIdPrefix: com.zyuapp
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: ""
targets:
  Books:
    type: application
    platform: macOS
    sources:
      - path: Books
    info:
      path: Books/Support/Info.plist
      properties:
        CFBundleDisplayName: Books
        CFBundleName: Books
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.books
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container, org.idpf.epub-folder]
          - CFBundleTypeName: Kindle Book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [com.zyuapp.books.mobi, com.zyuapp.books.azw3]
          - CFBundleTypeName: FictionBook
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [com.zyuapp.books.fb2, com.zyuapp.books.fbz]
          - CFBundleTypeName: Comic Book Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [com.zyuapp.books.cbz, com.zyuapp.books.cbr, com.zyuapp.books.cb7, com.zyuapp.books.cbt]
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Text Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text, net.daringfireball.markdown, public.rtf, org.openxmlformats.wordprocessingml.document, org.oasis-open.opendocument.text, public.html]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.zyuapp.books.mobi
            UTTypeDescription: Mobipocket eBook
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [mobi, prc]
              public.mime-type: [application/x-mobipocket-ebook]
          - UTTypeIdentifier: com.zyuapp.books.azw3
            UTTypeDescription: Kindle eBook
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [azw3, azw, kf8]
              public.mime-type: [application/vnd.amazon.ebook]
          - UTTypeIdentifier: com.zyuapp.books.fb2
            UTTypeDescription: FictionBook
            UTTypeConformsTo: [public.xml, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [fb2]
              public.mime-type: [application/x-fictionbook+xml]
          - UTTypeIdentifier: com.zyuapp.books.fbz
            UTTypeDescription: FictionBook Archive
            UTTypeConformsTo: [public.zip-archive, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [fbz]
          - UTTypeIdentifier: com.zyuapp.books.cbz
            UTTypeDescription: Comic Book Archive
            UTTypeConformsTo: [public.zip-archive, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [cbz]
              public.mime-type: [application/vnd.comicbook+zip]
          - UTTypeIdentifier: com.zyuapp.books.cbr
            UTTypeDescription: Comic Book Archive (RAR)
            UTTypeConformsTo: [public.data, public.archive, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [cbr]
              public.mime-type: [application/vnd.comicbook-rar]
          - UTTypeIdentifier: com.zyuapp.books.cb7
            UTTypeDescription: Comic Book Archive (7z)
            UTTypeConformsTo: [public.data, public.archive, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [cb7]
          - UTTypeIdentifier: com.zyuapp.books.cbt
            UTTypeDescription: Comic Book Archive (TAR)
            UTTypeConformsTo: [public.tar-archive, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [cbt]
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
              public.mime-type: [text/markdown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyuapp.books
        PRODUCT_NAME: Books
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: NO
